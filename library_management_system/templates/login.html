{% extends "base.html" %}{% block auth %}<div class="auth"><div class="container"><div class="card p-4 mx-auto" style="max-width:420px">
<h4 class="text-center mb-3" style="color:var(--navy)"><i class="fa fa-book-open-reader"></i> Sign In</h4>
{% for c,m in get_flashed_messages(with_categories=true) %}<div class="alert alert-{{ c }}">{{ m }}</div>{% endfor %}
<form method="post"><input class="form-control mb-2" name="email" type="email" placeholder="Email" required><input class="form-control mb-2" name="password" type="password" placeholder="Password" required><button class="btn btn-primary w-100 mt-2">Sign In</button></form>
<p class="text-center mt-3 mb-0 small">New student? <a href="{{ url_for('register') }}">Register</a><br>Demo: admin@library.com / admin123</p></div></div></div>{% endblock %}
